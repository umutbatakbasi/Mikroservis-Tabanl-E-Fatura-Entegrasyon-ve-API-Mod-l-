# Nginx Reverse Proxy Configuration for E-Invoice Integration API
# Provides SSL/TLS termination, rate limiting, gzip compression, and DDoS protection

# Rate limiting zone (30 requests per second per IP)
limit_req_zone $binary_remote_addr zone=einvoice_api_limit:10m rate=30r/s;

# 1. HTTP Server Block (Redirect all port 80 traffic to HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name api.einvoice-erp.com;

    # Let's Encrypt ACME challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP requests to HTTPS with 301 Permanent Redirect
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server Block (Production Secure API Endpoint)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.einvoice-erp.com;

    # SSL / TLS Certificate paths (Managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/api.einvoice-erp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.einvoice-erp.com/privkey.pem;

    # Modern TLS Security Protocols & Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS (HTTP Strict Transport Security - 1 Year)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Max body size for large e-invoice payloads (XML/JSON)
    client_max_body_size 25M;

    # Buffer & Timeout settings to protect against Slowloris attacks
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    client_body_timeout 12;
    client_header_timeout 12;
    keepalive_timeout 15;
    send_timeout 10;

    # Gzip compression for JSON and XML responses
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json application/xml text/xml text/plain application/javascript;

    # Access & Error logs
    access_log /var/log/nginx/einvoice_access.log;
    error_log /var/log/nginx/einvoice_error.log warn;

    # Reverse proxy forward to Gunicorn/Uvicorn runtime
    location / {
        # Apply rate limiting with burst allowance
        limit_req zone=einvoice_api_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket & Keepalive support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward real client headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts for long-running calculations
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
